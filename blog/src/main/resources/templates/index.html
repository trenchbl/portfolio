<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Main Container */
        #app {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Blog Post Card */
        .blog-post {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px;
            margin: 20px 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .blog-post:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        /* Blog Post Title */
        .blog-post h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            line-height: 1.2;
        }

        /* Blog Post Metadata */
        .blog-meta {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }

        /* Blog Post Content */
        .blog-content {
            font-size: 1.1rem;
            color: #444;
            line-height: 1.8;
        }

        .blog-content p {
            margin-bottom: 20px;
            text-align: justify;
        }

        .blog-content p:last-child {
            margin-bottom: 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            #app {
                padding: 0 10px;
            }

            .blog-post {
                padding: 30px 25px;
                border-radius: 8px;
            }

            .blog-post h1 {
                font-size: 1.8rem;
            }

            .blog-content {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .blog-post {
                padding: 20px 15px;
            }

            .blog-post h1 {
                font-size: 1.5rem;
            }
        }

        /* Loading State */
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div id="app">
        <article class="blog-post" v-if="blogPost">
            <h1>{{ blogPost.title }}</h1>
            <div class="blog-meta">
                <span>{{ blogPost.date }}</span> · <span>{{ blogPost.author }}</span>
            </div>
            <div class="blog-content">
                <p v-for="(paragraph, index) in blogPost.content" :key="index">
                    {{ paragraph }}
                </p>
            </div>
        </article>
        <div v-else class="loading">
            Loading...
        </div>
    </div>

    <!-- Vue 3 from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    blogPost: {
                        title: 'Welcome to My Blog',
                        author: 'Blog Author',
                        date: 'November 14, 2025',
                        content: [
                            'Welcome to my personal blog! This is a space where I share my thoughts, experiences, and insights on various topics that interest me. Whether you\'re here to learn something new or just browsing, I hope you find the content engaging and valuable.',
                            'This blog is built using Spring Boot for the backend and Vue.js 3 for the frontend, demonstrating how modern web technologies can work together seamlessly. The combination of these powerful frameworks allows for creating responsive, dynamic, and maintainable web applications.',
                            'In future posts, I\'ll be diving deeper into software development, web technologies, best practices, and sharing tutorials that can help both beginners and experienced developers. Stay tuned for more exciting content!',
                            'Thank you for visiting, and I look forward to sharing this journey with you. Feel free to explore, and don\'t hesitate to reach out if you have any questions or suggestions for future topics.'
                        ]
                    }
                };
            },
            mounted() {
                console.log('Vue app mounted successfully!');
            }
        }).mount('#app');
    </script>
</body>
</html>
