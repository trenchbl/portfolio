<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 80px; /* Account for fixed navbar */
        }

        /* Navigation Bar Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: box-shadow 0.3s ease;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: relative;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-brand:hover {
            color: #764ba2;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-links li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 1rem;
            padding: 0.5rem 0;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .nav-links li a:hover {
            color: #667eea;
        }

        .nav-links li a:hover::after {
            width: 100%;
        }

        .nav-links li a.active {
            color: #667eea;
            font-weight: 600;
        }

        .nav-links li a.active::after {
            width: 100%;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
            z-index: 1001;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: #333;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(7px, 7px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* Main Content */
        main {
            padding: 40px 20px;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Blog Post Card */
        .blog-post {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px;
            margin: 20px 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .blog-post:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        /* Blog Post Title */
        .blog-post h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            line-height: 1.2;
        }

        /* Blog Post Metadata */
        .blog-meta {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
        }

        /* Blog Post Content */
        .blog-content {
            font-size: 1.1rem;
            color: #444;
            line-height: 1.8;
        }

        .blog-content p {
            margin-bottom: 20px;
            text-align: justify;
        }

        .blog-content p:last-child {
            margin-bottom: 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }

            main {
                padding: 20px 10px;
            }

            .nav-container {
                padding: 1rem 1.5rem;
            }

            .hamburger {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(10px);
                flex-direction: column;
                justify-content: flex-start;
                padding: 2rem;
                gap: 1.5rem;
                transition: left 0.3s ease;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            }

            .nav-links.active {
                left: 0;
            }

            .nav-links li {
                width: 100%;
                text-align: center;
            }

            .nav-links li a {
                display: block;
                padding: 1rem;
                font-size: 1.1rem;
            }

            .blog-post {
                padding: 30px 25px;
                border-radius: 8px;
            }

            .blog-post h1 {
                font-size: 1.8rem;
            }

            .blog-content {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .nav-brand {
                font-size: 1.2rem;
            }

            .nav-container {
                padding: 1rem;
            }

            .blog-post {
                padding: 20px 15px;
            }

            .blog-post h1 {
                font-size: 1.5rem;
            }
        }

        /* Loading State */
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }
    </style>
</head>
<body id="app">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">My Blog</a>
            <div class="hamburger" @click="toggleMenu" :class="{ active: isMenuOpen }">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links" :class="{ active: isMenuOpen }">
                <li><a href="/" class="active" @click="closeMenu">Home</a></li>
                <li><a href="/about" @click="closeMenu">About</a></li>
                <li><a href="/categories" @click="closeMenu">Categories</a></li>
                <li><a href="/archive" @click="closeMenu">Archive</a></li>
                <li><a href="/contact" @click="closeMenu">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container">
            <article class="blog-post" v-if="blogPost">
                <h1>{{ blogPost.title }}</h1>
                <div class="blog-meta">
                    <span>{{ blogPost.date }}</span> · <span>{{ blogPost.author }}</span>
                </div>
                <div class="blog-content">
                    <p v-for="(paragraph, index) in blogPost.content" :key="index">
                        {{ paragraph }}
                    </p>
                </div>
            </article>
            <div v-else class="loading">
                Loading...
            </div>
        </div>
    </main>

    <!-- Vue 3 from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    isMenuOpen: false,
                    blogPost: {
                        title: 'Welcome to My Blog',
                        author: 'Blog Author',
                        date: 'November 14, 2025',
                        content: [
                            'Welcome to my personal blog! This is a space where I share my thoughts, experiences, and insights on various topics that interest me. Whether you\'re here to learn something new or just browsing, I hope you find the content engaging and valuable.',
                            'This blog is built using Spring Boot for the backend and Vue.js 3 for the frontend, demonstrating how modern web technologies can work together seamlessly. The combination of these powerful frameworks allows for creating responsive, dynamic, and maintainable web applications.',
                            'In future posts, I\'ll be diving deeper into software development, web technologies, best practices, and sharing tutorials that can help both beginners and experienced developers. Stay tuned for more exciting content!',
                            'Thank you for visiting, and I look forward to sharing this journey with you. Feel free to explore, and don\'t hesitate to reach out if you have any questions or suggestions for future topics.'
                        ]
                    }
                };
            },
            methods: {
                toggleMenu() {
                    this.isMenuOpen = !this.isMenuOpen;
                },
                closeMenu() {
                    this.isMenuOpen = false;
                }
            },
            mounted() {
                console.log('Vue app mounted successfully!');
            }
        }).mount('#app');
    </script>
</body>
</html>
