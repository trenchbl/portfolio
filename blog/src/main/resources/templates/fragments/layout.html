<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Blog'">Blog</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

<header th:fragment="header(active)" class="site-header">
    <div class="container site-header__inner">
        <a class="site-header__brand" th:href="@{/}">Blog</a>
        <nav class="site-nav" aria-label="Main">
            <a th:href="@{/}" th:classappend="${active == 'home'} ? 'is-active'">Home</a>
            <a th:href="@{/about}" th:classappend="${active == 'about'} ? 'is-active'">About</a>
            <th:block sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/posts}" th:classappend="${active == 'admin'} ? 'is-active'">Admin</a>
                <form class="site-nav__logout" method="post" th:action="@{/logout}">
                    <button type="submit" class="link-button">Log out</button>
                </form>
            </th:block>
        </nav>
    </div>
</header>

<nav th:fragment="admin-nav(active)" class="admin-nav" aria-label="Admin">
    <a th:href="@{/admin/posts}" th:classappend="${active == 'posts'} ? 'is-active'">Posts</a>
    <a th:href="@{/admin/categories}" th:classappend="${active == 'categories'} ? 'is-active'">Categories</a>
</nav>

<p th:fragment="flash" th:if="${message}" class="flash" role="status" th:text="${message}">Saved</p>

<article th:fragment="post-card(post)" class="post-card">
    <h2 class="post-card__title">
        <a th:href="@{/posts/{slug}(slug=${post.slug})}" th:text="${post.title}">Post title</a>
    </h2>
    <p class="post-meta">
        <time th:datetime="${#temporals.formatISO(post.publishedAt)}"
              th:text="${#temporals.format(post.publishedAt, 'd MMMM yyyy')}">1 January 2026</time>
        in <a th:href="@{/categories/{slug}(slug=${post.category.slug})}" th:text="${post.category.name}">Category</a>
    </p>
    <p class="post-card__summary" th:if="${post.summary}" th:text="${post.summary}">Summary</p>
    <ul th:replace="~{fragments/layout :: tag-list(${post.tags})}"></ul>
</article>

<ul th:fragment="tag-list(tags)" th:unless="${#lists.isEmpty(tags)}" class="tag-list" aria-label="Tags">
    <li th:each="tag : ${tags}">
        <a class="tag" th:href="@{/tags/{slug}(slug=${tag.slug})}" th:text="|#${tag.name}|">#tag</a>
    </li>
</ul>

<nav th:fragment="pagination(page, baseUrl)" th:if="${page.totalPages > 1}" class="pagination" aria-label="Pagination">
    <a th:if="${page.hasPrevious()}" rel="prev" class="pagination__link"
       th:href="${page.number == 1} ? @{${baseUrl}} : @{${baseUrl}(page=${page.number})}">&larr; Newer posts</a>
    <span class="pagination__status"
          th:text="|Page ${page.number + 1} of ${page.totalPages}|">Page 1 of 2</span>
    <a th:if="${page.hasNext()}" rel="next" class="pagination__link"
       th:href="@{${baseUrl}(page=${page.number + 2})}">Older posts &rarr;</a>
</nav>

<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <p>&copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> Blog</p>
    </div>
</footer>

</body>
</html>
