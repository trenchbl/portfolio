<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Blog</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 80px; /* Account for fixed navbar */
        }

        /* Navigation Bar Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: box-shadow 0.3s ease;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: relative;
        }

        .nav-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-brand:hover {
            color: #764ba2;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-links li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 1rem;
            padding: 0.5rem 0;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .nav-links li a:hover {
            color: #667eea;
        }

        .nav-links li a:hover::after {
            width: 100%;
        }

        .nav-links li a.active {
            color: #667eea;
            font-weight: 600;
        }

        .nav-links li a.active::after {
            width: 100%;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
            z-index: 1001;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: #333;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(7px, 7px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* Main Content */
        main {
            padding: 40px 20px;
        }

        /* Main Container */
        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Content Card */
        .content-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px;
            margin: 20px 0;
        }

        /* Page Title */
        .page-title {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 700;
            line-height: 1.2;
        }

        .page-subtitle {
            font-size: 1.1rem;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 40px;
        }

        /* Contact Form */
        .contact-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #fafafa;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background-color: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Success Message */
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Contact Info Section */
        .contact-info {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 2px solid #ecf0f1;
        }

        .contact-info h2 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #f8f9fa;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .social-icon {
            font-size: 1.2rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }

            main {
                padding: 20px 10px;
            }

            .nav-container {
                padding: 1rem 1.5rem;
            }

            .hamburger {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(10px);
                flex-direction: column;
                justify-content: flex-start;
                padding: 2rem;
                gap: 1.5rem;
                transition: left 0.3s ease;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            }

            .nav-links.active {
                left: 0;
            }

            .nav-links li {
                width: 100%;
                text-align: center;
            }

            .nav-links li a {
                display: block;
                padding: 1rem;
                font-size: 1.1rem;
            }

            .content-card {
                padding: 30px 25px;
                border-radius: 8px;
            }

            .page-title {
                font-size: 1.8rem;
            }

            .page-subtitle {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .nav-brand {
                font-size: 1.2rem;
            }

            .nav-container {
                padding: 1rem;
            }

            .content-card {
                padding: 20px 15px;
            }

            .page-title {
                font-size: 1.5rem;
            }

            .social-links {
                flex-direction: column;
            }

            .social-link {
                justify-content: center;
            }
        }
    </style>
</head>
<body id="app">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">My Blog</a>
            <div class="hamburger" @click="toggleMenu" :class="{ active: isMenuOpen }">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links" :class="{ active: isMenuOpen }">
                <li><a href="/" @click="closeMenu">Home</a></li>
                <li><a href="/about" @click="closeMenu">About</a></li>
                <li><a href="/categories" @click="closeMenu">Categories</a></li>
                <li><a href="/archive" @click="closeMenu">Archive</a></li>
                <li><a href="/contact" class="active" @click="closeMenu">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="content-card">
                <h1 class="page-title">Get In Touch</h1>
                <p class="page-subtitle">
                    Have a question or want to work together? I'd love to hear from you!
                </p>

                <!-- Contact Info -->
                <div class="contact-info">
                    <h2>Connect With Me</h2>
                    <div class="social-links">
                        <a href="https://github.com" target="_blank" class="social-link">
                            <span class="social-icon">🔗</span>
                            <span>GitHub</span>
                        </a>
                        <a href="https://linkedin.com" target="_blank" class="social-link">
                            <span class="social-icon">💼</span>
                            <span>LinkedIn</span>
                        </a>
                        <a href="https://twitter.com" target="_blank" class="social-link">
                            <span class="social-icon">🐦</span>
                            <span>Twitter</span>
                        </a>
                        <a href="mailto:blog@example.com" class="social-link">
                            <span class="social-icon">✉️</span>
                            <span>Email</span>
                        </a>
                    </div>
                </div>

                <!-- Success Message -->
                <div class="success-message" :class="{ show: formSubmitted }">
                    Thank you for your message! I'll get back to you as soon as possible.
                </div>

                <!-- Contact Form -->
                <form class="contact-form" @submit.prevent="submitForm">
                    <div class="form-group">
                        <label for="name">Name <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="name" 
                            v-model="formData.name"
                            required
                            placeholder="Your full name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input 
                            type="email" 
                            id="email" 
                            v-model="formData.email"
                            required
                            placeholder="your.email@example.com"
                        >
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="subject" 
                            v-model="formData.subject"
                            required
                            placeholder="What is this about?"
                        >
                    </div>

                    <div class="form-group">
                        <label for="message">Message <span class="required">*</span></label>
                        <textarea 
                            id="message" 
                            v-model="formData.message"
                            required
                            placeholder="Your message here..."
                        ></textarea>
                    </div>

                    <button type="submit" class="submit-btn" :disabled="isSubmitting">
                        {{ isSubmitting ? 'Sending...' : 'Send Message' }}
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Vue 3 from CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    isMenuOpen: false,
                    isSubmitting: false,
                    formSubmitted: false,
                    formData: {
                        name: '',
                        email: '',
                        subject: '',
                        message: ''
                    }
                };
            },
            methods: {
                toggleMenu() {
                    this.isMenuOpen = !this.isMenuOpen;
                },
                closeMenu() {
                    this.isMenuOpen = false;
                },
                submitForm() {
                    // Simulate form submission
                    this.isSubmitting = true;
                    
                    // In a real application, you would send this data to a backend API
                    console.log('Form submitted:', this.formData);
                    
                    // Simulate API call delay
                    setTimeout(() => {
                        this.isSubmitting = false;
                        this.formSubmitted = true;
                        
                        // Reset form
                        this.formData = {
                            name: '',
                            email: '',
                            subject: '',
                            message: ''
                        };
                        
                        // Hide success message after 5 seconds
                        setTimeout(() => {
                            this.formSubmitted = false;
                        }, 5000);
                    }, 1500);
                }
            },
            mounted() {
                console.log('Contact page mounted successfully!');
            }
        }).mount('#app');
    </script>
</body>
</html>
