spring.application.name=blog

# Machine-specific settings and secrets, such as the first admin's password. Git ignores this file.
spring.config.import=optional:file:./application-local.properties

# The site is written in English, so dates are too, whatever the browser's language
spring.web.locale=en
spring.web.locale-resolver=fixed

# Database (matches compose.yaml)
spring.datasource.url=jdbc:mysql://localhost:3306/blogdb
spring.datasource.username=bloguser
spring.datasource.password=blogpass

# Liquibase owns the schema; Hibernate only validates it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Changesets marked contextFilter="dev" (sample data) only run in this context
spring.liquibase.contexts=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Load lazy categories and tags for up to 20 posts in one query instead of one query per post
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Show SQL while developing (turned off in the prod profile)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Health for Docker and load balancers; only this endpoint is exposed by default
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
